<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buddy | Your study abroad assistant</title>
<style>
:root{--primary:#1F8268;--primary-dark:#166650;--mint:#2BB793;--sun:#FFD166;--sky:#83BDE4;--bg:#F4F2F6;--surface:#fff;--lav:#F1EAFA;--ink:#190A28;--muted:#5F5469;--line:#E2DCEA;--danger:#B3261E;--r:12px;--r2:8px}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
a{color:var(--primary-dark)}
.hide{display:none!important}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(244,242,246,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;height:60px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px}
.logo i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,var(--mint) 45%,var(--primary) 100%);display:block}
.tabs{display:flex;gap:4px;margin-left:12px}
.tab{border:0;background:none;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600}
.tab.on{background:var(--ink);color:#fff}
.tab small{margin-left:6px;background:var(--lav);color:var(--ink);border-radius:999px;padding:1px 7px;font-size:11px}
.tab.on small{background:#fff3}
.me{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--lav);display:grid;place-items:center;font-weight:700;color:var(--primary-dark)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:0}
/* buttons */
.btn{border:0;border-radius:999px;padding:11px 20px;font-weight:600;background:var(--primary);color:#fff}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--lav)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 15px;font-weight:500;color:var(--ink)}
.chip:hover{border-color:var(--primary);background:var(--lav)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
/* welcome + onboarding */
.center{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(1200px 500px at 20% -10%,#dff5ee 0,transparent 60%),radial-gradient(900px 500px at 100% 0,var(--lav) 0,transparent 55%),var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;max-width:560px;width:100%;box-shadow:0 10px 40px rgba(25,10,40,.06)}
.card h1{font-size:28px;line-height:1.2;margin:0 0 8px}
.card h2{font-size:22px;margin:0 0 6px}
.muted{color:var(--muted)}
.field{width:100%;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;background:#fff;margin:14px 0}
.field:focus{outline:2px solid var(--mint);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.steps{display:flex;gap:6px;margin-bottom:20px}
.steps i{height:5px;flex:1;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--primary)}
.row-end{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.notice{background:#FFF6DD;border:1px solid #F3DC9A;border-radius:var(--r2);padding:10px 14px;font-size:13px;margin:12px 0}
/* hero */
.hero{margin:22px 0 8px;border-radius:28px;padding:44px 36px;position:relative;overflow:hidden;background:linear-gradient(135deg,#e3f6ef 0%,#eee6fa 55%,#dcecf8 100%);border:1px solid var(--line)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.7;animation:drift 14s ease-in-out infinite alternate}
.hero::before{width:320px;height:320px;background:#bfeadb;right:-60px;top:-80px}
.hero::after{width:260px;height:260px;background:#d9c9f3;left:30%;bottom:-120px;animation-delay:-6s}
.hero>*{position:relative;z-index:1}
.hero-grid{display:flex;gap:36px;align-items:center}
.orb{flex:0 0 150px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#b9efdc 28%,var(--mint) 62%,var(--primary) 100%);box-shadow:0 0 0 14px #ffffff55,0 0 0 30px #ffffff33,0 20px 60px rgba(31,130,104,.35);animation:breathe 6s ease-in-out infinite;border:0;cursor:pointer}
.hero h1{font-size:34px;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em}
.hero p{margin:0 0 20px;color:#3d3150;font-size:16px}
.ask{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 8px 30px rgba(25,10,40,.08);cursor:text;max-width:560px;border:1px solid #fff}
.ask span{color:var(--muted);flex:1;text-align:left}
.ask .btn{padding:10px 20px}
.prompts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.prompts button{border:0;background:#ffffffa8;border-radius:999px;padding:7px 14px;font-size:13px;color:var(--ink)}
.prompts button:hover{background:#fff}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-30px,24px)}}
@media (prefers-reduced-motion:reduce){.orb,.hero::before,.hero::after{animation:none}}
/* rows */
.sec{margin:30px 0 8px}
.sec h3{margin:0;font-size:20px}
.sec p{margin:2px 0 12px;color:var(--muted);font-size:14px}
.scroller{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x proximity}
.scroller::-webkit-scrollbar{height:8px}.scroller::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
.pc{flex:0 0 272px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.pc:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(25,10,40,.1)}
.pc .tag{font-size:12px;color:var(--primary-dark);background:#E5F5EF;border-radius:999px;padding:2px 10px;align-self:flex-start;font-weight:600}
.pc h4{margin:0;font-size:16px;line-height:1.3}
.pc .sub{font-size:13px;color:var(--muted)}
.pc .why{font-size:14px;flex:1}
.pc .acts{display:flex;gap:8px;margin-top:4px}
.pc .acts button{flex:1;border-radius:999px;border:1px solid var(--line);background:#fff;padding:7px 8px;font-size:13px;font-weight:600}
.pc .acts button.yes.on{background:var(--primary);border-color:var(--primary);color:#fff}
.pc .acts button.no:hover{border-color:var(--danger);color:var(--danger)}
.sk{flex:0 0 272px;height:210px;border-radius:var(--r);background:linear-gradient(90deg,#ece8f1 25%,#f7f5fa 50%,#ece8f1 75%);background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
.rowerr{background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:16px;color:var(--muted);display:flex;gap:12px;align-items:center;justify-content:space-between}
.insight{background:#fff;border:1px solid var(--line);border-left:4px solid var(--mint);border-radius:var(--r);padding:14px 16px;margin:18px 0 0;font-size:14px}
/* testimonials */
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tcard p{margin:0 0 12px}
.tcard b{display:block;font-size:14px}.tcard span{font-size:12px;color:var(--muted)}
footer{margin:36px 0 48px;color:var(--muted);font-size:13px;text-align:center}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(25,10,40,.45);z-index:70;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(640px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.sheet.mid{margin:auto;height:auto;max-height:92vh;border-radius:20px;width:min(520px,calc(100% - 24px))}
.ov.mid{justify-content:center;align-items:center}
.sh-head{position:sticky;top:0;background:var(--bg);padding:16px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;z-index:2}
.sh-head h3{margin:0;font-size:18px;flex:1;line-height:1.3}
.x{border:0;background:#fff;border:1px solid var(--line);width:34px;height:34px;border-radius:50%}
.sh-body{padding:20px 22px 28px;flex:1}
.kv{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kv div{display:flex;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border:0}
.kv b{flex:0 0 140px;color:var(--muted);font-weight:600}
.kv em{font-style:normal;color:var(--muted)}
.load{text-align:center;padding:40px 10px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--primary);margin:0 auto 14px;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.cl{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;padding:14px;display:flex;gap:12px;align-items:flex-start}
.cl.done{background:#F2FAF7}
.cl .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);flex:0 0 22px;display:grid;place-items:center;background:#fff;color:#fff;font-size:14px;margin-top:2px}
.cl.done .box{background:var(--primary);border-color:var(--primary)}
.cl .t{flex:1}.cl .t b{display:block}.cl .t span{font-size:13px;color:var(--muted)}
.lock{font-size:12px;background:var(--sun);border-radius:999px;padding:2px 9px;margin-left:6px;font-weight:600}
.ap{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;margin-bottom:12px}
.ap .i{flex:1}.ap h4{margin:0 0 2px}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--lav);font-weight:600}
.pill.ok{background:#DDF4EA;color:var(--primary-dark)}
textarea.field{min-height:140px;resize:vertical}
.hint{background:#fff;border-left:4px solid var(--sun);border-radius:var(--r2);padding:12px 14px;font-size:14px;margin:10px 0}
.hint b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:2px}
.draft{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;font-size:15px}
/* chat */
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.m{max-width:88%;padding:12px 15px;border-radius:16px;white-space:pre-wrap;font-size:15px}
.m.b{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;align-self:flex-start}
.m.u{background:var(--primary);color:#fff;border-top-right-radius:4px;align-self:flex-end}
.m small{display:block;margin-top:8px;color:var(--muted)}
.m small a{margin-right:8px}
.typing{display:inline-flex;gap:4px}.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.cinput{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--bg)}
.cinput input{min-width:0;flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;background:#fff}
.cchips{padding:0 22px 8px;display:flex;flex-wrap:wrap;gap:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;z-index:90;font-size:14px;max-width:90%}
@media (max-width:760px){
 .hero{padding:28px 20px;border-radius:22px}.hero-grid{flex-direction:column;align-items:flex-start;gap:20px}.orb{flex-basis:96px;width:96px;height:96px;box-shadow:0 0 0 8px #ffffff55,0 0 0 18px #ffffff33}
 .hero h1{font-size:26px}.tgrid{grid-template-columns:1fr}.top .wrap{height:auto;flex-wrap:wrap;gap:6px 8px;padding-top:8px;padding-bottom:8px}.tabs{order:3;width:100%;margin-left:0;overflow-x:auto}.me span{display:none}.tab{padding:7px 12px;font-size:14px;white-space:nowrap}
 .pc,.sk{flex-basis:244px}.kv div{flex-direction:column;gap:2px}.kv b{flex-basis:auto}.card{padding:24px}
 .ap{flex-direction:column;align-items:flex-start}.sheet{width:100%}
}

/* dock */
#dock{position:relative;z-index:40}
.launch{position:fixed;right:20px;bottom:20px;z-index:41;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:7px 18px 7px 7px;background:#fff;box-shadow:0 10px 34px rgba(25,10,40,.18);font-weight:600;color:var(--ink)}
.launch i{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0,#b9efdc 28%,var(--mint) 62%,var(--primary) 100%);display:block;animation:breathe 6s ease-in-out infinite}
.panel{position:fixed;right:20px;bottom:84px;width:380px;max-width:calc(100vw - 24px);height:min(520px,calc(100vh - 110px));background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:0 20px 60px rgba(25,10,40,.28);display:flex;flex-direction:column;z-index:41;overflow:hidden}
.panel .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel .msgs{padding:14px 16px}
.panel .cchips{padding:0 16px 8px;max-height:84px;overflow:auto;gap:6px}
.panel .chip{padding:6px 12px;font-size:13px}
.panel .cinput{padding:10px 12px}
.mini{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--bg);font-size:13px}
.mini b{display:block;font-size:13px}.mini span{color:var(--muted)}
.mini:hover{border-color:var(--primary)}
.nudge{position:fixed;right:20px;bottom:84px;width:300px;max-width:calc(100vw - 40px);background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:0 14px 44px rgba(25,10,40,.22);z-index:41;animation:pop .3s ease-out}
.nudge b{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--primary-dark)}
.nudge .nq{font-weight:600;margin:2px 24px 0 0}
.nudge .chips{margin:10px 0 8px;gap:6px}
.nudge .chip{padding:6px 12px;font-size:13px}
.nudge .nx{position:absolute;right:10px;top:10px;border:0;background:none;color:var(--muted);width:24px;height:24px}
.panel .ph .grow{display:flex;gap:8px;align-items:center}
.xl{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600}
.panel.full{position:fixed;inset:0;right:0;bottom:0;left:0;width:100%;max-width:none;height:100%;border-radius:0;border:0;box-shadow:none;z-index:60}
.panel.full .ph{padding:14px max(16px,calc((100% - 760px) / 2))}
.panel.full .msgs{padding:18px max(16px,calc((100% - 760px) / 2))}
.panel.full .cchips{padding:0 max(16px,calc((100% - 760px) / 2)) 10px}
.panel.full .cinput{padding:12px max(16px,calc((100% - 760px) / 2)) 18px}
.panel.full .m{font-size:16px;max-width:80%}
#dock.isfull .launch,#dock.isfull .nudge{display:none}
@keyframes pop{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:760px){.panel{right:8px;left:8px;width:auto;max-width:none;bottom:76px;height:min(70vh,560px)}.launch{right:12px;bottom:12px}.nudge{right:12px;bottom:76px}}

/* v3: bottom left dock, cards with photos, explore, splash */
.launch{left:20px;right:auto}
.panel{left:20px;right:auto}
.nudge{left:20px;right:auto}
@media (max-width:760px){.panel{left:8px;right:8px}.launch{left:12px;right:auto}.nudge{left:12px;right:auto}}
.pc{padding:0;gap:0;overflow:hidden;flex:0 0 280px}
.pc .im{height:136px;position:relative;background:linear-gradient(135deg,var(--g1,#2BB793),var(--g2,#83BDE4));background-size:cover;background-position:center}
.pc .im::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,10,40,.05) 40%,rgba(25,10,40,.45))}
.pc .im.logo,.dimg.logo{background-color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;background-origin:content-box;padding:14px}
.pc .im.logo::after{display:none}
.pc .im.logo .tag{background:#E9F6F1}
.pc .im .ini{position:absolute;right:14px;bottom:8px;color:#fff;font-weight:800;font-size:30px;opacity:.85;z-index:1;letter-spacing:.02em}
.pc .im.has .ini{display:none}
.pc .im .tag{position:absolute;left:10px;top:10px;z-index:1;background:rgba(255,255,255,.94)}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:6px}
.grid .pc{flex:none}
.sech{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.sech .link{white-space:nowrap;font-size:14px;color:var(--primary-dark);font-weight:600}
.dimg{height:190px;border-radius:var(--r);background:linear-gradient(135deg,var(--g1,#2BB793),var(--g2,#83BDE4));background-size:cover;background-position:center;margin-bottom:14px;position:relative;overflow:hidden}
.dimg .ini{position:absolute;right:16px;bottom:10px;color:#fff;font-weight:800;font-size:40px;opacity:.85}
.dimg.has .ini{display:none}
.dimg.logo{background-color:#fff;background-size:contain;background-repeat:no-repeat;background-position:center;background-origin:content-box;padding:14px;box-sizing:border-box;border:1px solid var(--line,#E7E1EE)}
.skipbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px dashed var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:14px;font-size:14px}
.pill.pay{background:var(--sun)}
.banner{background:linear-gradient(135deg,#e3f6ef,#eee6fa);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
#splash{position:fixed;inset:0;z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center;padding-top:250px;background:linear-gradient(135deg,#e3f6ef 0%,#eee6fa 55%,#dcecf8 100%);transition:opacity .7s .25s}
#splash.on{display:flex}
#splash.out{opacity:0;pointer-events:none}
.sp-name{font-size:38px;font-weight:800;letter-spacing:-.02em;animation:fadeup .8s .5s both}
.sp-tag{color:var(--muted);margin-top:4px;animation:fadeup .8s .8s both}
#sporb{position:fixed;z-index:201;left:50%;top:50%;width:140px;height:140px;margin:-190px 0 0 -70px;border-radius:50%;display:none;background:radial-gradient(circle at 35% 30%,#fff 0,#b9efdc 28%,var(--mint) 62%,var(--primary) 100%);box-shadow:0 0 0 14px #ffffff55,0 0 0 30px #ffffff33,0 20px 60px rgba(31,130,104,.35)}
#sporb.on{display:block;animation:orbin 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes orbin{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#sporb.on,.sp-name,.sp-tag{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="ovs"></div>
<div id="dock"></div>
<div id="splash"><div class="sp-name">Buddy</div><div class="sp-tag">Your study abroad assistant</div></div><div id="sporb"></div>
<div id="toast" class="toast hide"></div>
<script src="/catalogue.js"></script>
<script>
'use strict';
/* ---------- state ---------- */
var KEY = 'buddy_live_v2';
var MAX_APPS = 8;
var S = load() || fresh();
var LIVE = true;            // set by /api/health
var rowState = {};          // theme -> 'loading' | 'ok' | 'err'
var rowErr = {};
var tab = 'home';
var ovStack = [];

function fresh() {
  return { step: 'welcome', name: '', p: { courseDecided: 'no', countryDecided: 'no' }, obStep: 0, rows: {}, insight: '', progs: {}, det: {}, interested: [], not: [], apps: [], freeId: null, paid: false, story: {}, why: {}, sop: {}, iq: {}, chat: [], chatQ: '', chatAsked: 0, chatShown: false, listAt: 0, skipQ: [], nudgeNo: 0, custom: [], customKey: '', gmail: false, cacheKey: '' };
}
function load() { try { var j = JSON.parse(localStorage.getItem(KEY)); return j && j.p ? Object.assign(fresh(), j) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
function reset() { try { localStorage.removeItem(KEY); } catch (e) { } S = fresh(); rowState = {}; closeAll(); render(); }

/* ---------- helpers ---------- */

}
function openDraft(id, make) {
  var p = P(id), d = openOv(head('Statement of purpose draft') + '<div class="sh-body" id="sb"></div>'); wireX(d);
  var b = d.querySelector('#sb');
  function paint() {
    var s = S.sop[id]; var src = s.src || [];
    b.innerHTML = (s.sample ? '<div class="notice">This is a sample so you can see how the draft looks. The brackets show what you would write. Answer the questions to make it yours.</div>' : '') + (s.plain ? '<div class="notice">Buddy\'s writing helper did not answer, so this draft is your own answers put in order. Edit it, or tap Write again to try the helper once more.</div>' : '') +
      '<p class="muted" style="font-size:13px">Built only from your answers. Square brackets mark details Buddy needs from you. Edit freely.</p><textarea id="dt" class="field" style="min-height:360px">' + esc(s.text) + '</textarea>' +
      (src.length ? '<p class="muted" style="font-size:12px">Built from: ' + src.map(function (x, i) { return 'paragraph ' + (i + 1) + ' = ' + (x.join(', ') || 'your answers'); }).join(' | ') + '</p>' : '') +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="dl">Download</button><button class="btn ghost" id="cp">Copy</button><button class="btn ghost" id="rg">Write again</button><button class="btn ghost" id="ed">Edit my answers</button></div>';
    b.querySelector('#dt').oninput = function () { S.sop[id].text = this.value; save(); };
    b.querySelector('#dl').onclick = function () { download('sop-' + id + '.txt', clean(S.sop[id].text)); };
    b.querySelector('#cp').onclick = function () { var t = b.querySelector('#dt'); t.select(); try { document.execCommand('copy'); toast('Copied'); } catch (e) { } };
    b.querySelector('#rg').onclick = function () { closeOv(d); openDraft(id, true); };
    b.querySelector('#ed').onclick = function () { closeOv(d); openStory(id, 0); };
  }
  if (!make && S.sop[id]) return paint();
  if (make && storyCount(id) === 0) { S.sop[id] = sampleDraft(id); save(); return paint(); }
  b.innerHTML = loadingBody(['Buddy is writing your draft from your answers...', 'Putting your story in order...']);
  var det = S.det[id] || {}, ans = Object.assign({}, S.story, { WHY: S.why[id] || '' });
  api('sop', { profile: S.p, college: { university: p.university, program: p.program, sop_requirement: det.sop_requirement, highlights: det.highlights }, answers: ans })
    .then(function (r) { S.sop[id] = { text: r.text, src: r.src }; save(); paint(); claimFree(id); })
    .catch(function (e) { S.sop[id] = localDraft(id); save(); paint(); claimFree(id); toast(e.message); });
}

/* ---------- interview: fixed question bank, model only for feedback ---------- */
function openInterview(id) {
  var p = P(id), d = openOv(head('Interview prep | ' + p.university) + '<div class="sh-body" id="ib"></div>'); wireX(d);
  var b = d.querySelector('#ib'), qs = interviewQs(p);
  function list() {
    b.innerHTML = '<p class="muted">Pick a question, write your answer, and get feedback.</p>' + qs.map(function (q, i) { return '<div class="cl" style="cursor:pointer" data-q="' + i + '"><div class="t"><b>' + esc(q) + '</b></div></div>'; }).join('');
    b.querySelectorAll('[data-q]').forEach(function (e) { e.onclick = function () { one(+e.getAttribute('data-q')); }; });
  }
  function one(i) {
    var q = qs[i];
    b.innerHTML = '<button class="link" id="bk">All questions</button><h2 style="font-size:19px;margin-top:10px">' + esc(q) + '</h2><textarea id="ia" class="field" placeholder="Answer as you would in the interview."></textarea><button class="btn" id="fb">Get feedback</button><div id="fo" style="margin-top:14px"></div>';
    b.querySelector('#bk').onclick = list;
    b.querySelector('#fb').onclick = function () {
      var a = b.querySelector('#ia').value.trim(); if (!a) { toast('Write a few lines first'); return; }
      var fo = b.querySelector('#fo'); fo.innerHTML = loadingBody(['Reading your answer...']);
      api('interview', { college: { university: p.university, program: p.program }, question: q, answer: a }).then(function (r) { fo.innerHTML = '<div class="draft">' + esc(r.text) + '</div>'; }).catch(function (e) { fo.innerHTML = '<div class="rowerr">' + esc(e.message) + '</div>'; });
    };
  }
  list();
}

/* ---------- Buddy dock: tap questions, instant answers, one model call only for free text ---------- */
var STARTERS = ['Which course suits my background?', 'How do I pick between two colleges?', 'What does a strong application need?'];
var QBANK = [
  { id: 'intake', q: 'When do you want to start your course?', opts: INTAKES, set: function (v) { S.p.intake = v; } },
  { id: 'budget', q: 'About how much can you spend on tuition in a year?', opts: ['Under 15 lakh', '15 to 30 lakh', 'Above 30 lakh', 'No limit'], set: function (v) { S.p.budget = v; S.p.budgetOn = /Under|15 to/.test(v); S.p.budgetLakh = /Under/.test(v) ? 15 : /15 to/.test(v) ? 30 : 0; } },
  { id: 'marks', q: 'What were your marks in your degree?', opts: ['Above 80%', '65 to 80%', 'Below 65%'], set: function (v) { S.p.marks = v; } },
  { id: 'tests', q: 'Which test have you taken, or plan to take?', opts: TESTS, set: function (v) { S.p.tests = v; } },
  { id: 'work', q: 'Do you have work experience?', opts: ['None', 'Under 2 years', '2 years or more'], set: function (v) { S.p.workYears = v; } },
  { id: 'priority', q: 'What matters most to you?', opts: ['Job outcomes', 'Low cost', 'Short course'], set: function (v) { S.p.priority = v; } }
];
var PKEY = { intake: 'intake', budget: 'budget', marks: 'marks', tests: 'tests', work: 'workYears', priority: 'priority' };
function qOf(id) { return QBANK.filter(function (q) { return q.id === id; })[0]; }
function answered(q) { return !!S.p[PKEY[q.id]] || S.skipQ.indexOf(q.id) >= 0; }
function nextQ(skipId) { return QBANK.filter(function (q) { return !answered(q) && q.id !== skipId; })[0]; }
var VAGUE = ['Skip', 'Not sure yet', 'Not taken yet'];
function specificCount() { return QBANK.filter(function (q) { var v = S.p[PKEY[q.id]]; return v && VAGUE.indexOf(v) < 0; }).length; }
function pushList() {
  var n = specificCount(), t = [3, 5, 6].filter(function (x) { return x <= n && x > S.listAt; }).pop();
  if (!t) return false;
  var ids = topIds(10); if (!ids.length) return false;
  S.listAt = t;
  if (!S.chat.length) S.chat.push({ role: 'assistant', content: 'Hi ' + first() + '.' });
  S.chat.push({ role: 'assistant', content: 'You gave me ' + n + ' clear answers, so I made a list for you. These ' + ids.length + ' fit you best right now. There are many more on Explore, sorted the same way. Tap one to see why it fits.', ids: ids, all: true });
  return true;
}
function answerQ(id, val, quiet) {
  var q = qOf(id);
  if (val === 'Skip') { if (S.skipQ.indexOf(id) < 0) S.skipQ.push(id); } else q.set(val);
  var made = quiet ? false : pushList();
  save(); if (S.step === 'main' && tab === 'home') softRender();
  if (made) { if (chatOpen) chatPaint(); else showListNudge(); }
}
function topIds(n) {
  var rows = rowsNow(), out = [];
  rows.forEach(function (r) { r.ids.forEach(function (id) { if (out.length < n && out.indexOf(id) < 0 && S.not.indexOf(id) < 0 && P(id)) out.push(id); }); if (out.length >= n) return; });
  return out.slice(0, n);
}
function staticAnswer(t) {
  var s = t.toLowerCase();
  if (t === STARTERS[0]) {
    var cats = (FIELD_CATS[fieldKey(S.p.field)] || []).map(function (c) { return '- ' + CATS[c].label + ': ' + CATS[c].pitch; }).join('\n');
    return 'For ' + (FIELD_SHORT[fieldKey(S.p.field)] || 'your') + ' graduates these paths are common:\n' + cats + '\nThe rows on Home follow these paths. Tell me what matters most to you and I will sort them.';
  }
  if (t === STARTERS[1]) return 'Compare on four things:\n1. What you will study, and whether it matches your goal.\n2. Total yearly cost, including living costs.\n3. Whether your marks and tests fit what they ask for.\n4. Where their graduates work.\nTap Interested on both, open each one, and use Check official pages. Pick the one whose course content fits your goal best.';
  if (t === STARTERS[2]) return 'A strong application has five things:\n1. A clear reason for this course and this college.\n2. A statement of purpose built from your real stories.\n3. Recommendation letters from people who know your work.\n4. Test scores that meet the college rule.\n5. Everything submitted before the deadline.\nOpen Applications and Buddy will build the checklist and help with the statement.';
  if (/\b(visa|visas|loan|loans|scholarship|scholarships|funding|fund)\b/.test(s)) return 'Buddy does not cover funding or visas yet. For now it helps you choose a course and college, apply, write your statement and prepare for interviews.';
  if (/deadline|fee|fees|tuition|requirement|requirements/.test(s)) return 'Deadlines, fees and requirements change every year. Open any college and tap Check official pages. Buddy reads the official page and shows what it finds, with the source.';
  if (/\b(gre|gmat|ielts|toefl|lsat|pte|test|tests)\b/.test(s)) return 'Test rules differ by college and change often. Open the college, tap Check official pages, and Buddy shows which tests it asks for. You can tell me which test you plan to take and I will use it to sort your lists.';
  if (/\b(sop|statement of purpose)\b/.test(s)) return 'Open Applications, start an application and choose Write with Buddy. It asks you eight short questions with hints, then writes the draft only from your answers.';
  if (/interview/.test(s)) return 'Open your application checklist and tap Start under Interview prep. Pick a question, type your answer and Buddy gives you feedback.';
  return null;
}
var chatOpen = false, busy = false, nudgeQ = '', lastNudge = Date.now() - 22000, pageT = Date.now();
function dockOn() {
  var dk = $('dock'); if (dk.firstChild) return;
  dk.innerHTML = '<div id="nudge" class="nudge hide"></div>' +
    '<div id="panel" class="panel hide"><div class="ph"><span class="logo"><i></i>Buddy</span><span class="grow"><button class="xl" id="pe">Full screen</button><button class="x" id="pc" aria-label="Close chat">x</button></span></div><div class="msgs" id="ms"></div><div class="cchips" id="cc"></div><div class="cinput"><input id="ci" placeholder="Type a message" maxlength="400"><button class="btn" id="cs">Send</button></div></div>' +
    '<button class="launch" id="launch"><i></i><span>Ask Buddy</span></button>';
  $('launch').onclick = function () { if (chatOpen) closeChat(); else openChat(); };
  $('pc').onclick = closeChat;
  $('pe').onclick = function () { setFull(!$('panel').classList.contains('full')); };
  $('cs').onclick = function () { var ci = $('ci'), v = ci.value.trim(); if (v) { ci.value = ''; userSays(v); } };
  $('ci').onkeydown = function (e) { if (e.key === 'Enter') $('cs').click(); };
}
function dockOff() { $('dock').innerHTML = ''; $('dock').className = ''; chatOpen = false; nudgeQ = ''; }
function setFull(on) {
  var pn = $('panel'); if (!pn) return;
  pn.classList.toggle('full', !!on); $('dock').classList.toggle('isfull', !!on); $('pe').textContent = on ? 'Shrink' : 'Full screen';
  document.body.style.overflow = on ? 'hidden' : ($('ovs').children.length ? 'hidden' : '');
  var ms = $('ms'); if (ms) ms.scrollTop = ms.scrollHeight;
}
function closeChat() { chatOpen = false; setFull(false); $('panel').classList.add('hide'); }
function openChat(prefill, full) {
  dockOn(); chatOpen = true; hideNudge(); $('panel').classList.remove('hide'); setFull(!!full);
  if (!S.chat.length) { S.chat.push({ role: 'assistant', content: 'Hi ' + first() + '. Three quick taps first, so your lists fit you.' }); chatNext(); }
  else chatPaint();
  if (prefill) userSays(prefill); else setTimeout(function () { var ci = $('ci'); if (ci && window.innerWidth > 760) ci.focus(); }, 50);
}
function chatNext() {
  var nq = nextQ();
  if (S.chatAsked < 3 && nq) { S.chatAsked++; S.chatQ = nq.id; S.chat.push({ role: 'assistant', content: nq.q }); }
  else { S.chatQ = ''; if (!S.chatShown) { S.chatShown = true; if (!pushList()) S.chat.push({ role: 'assistant', content: 'Thanks. Here are a few to start with. Your lists on Home are sorted with your answers. Ask me anything, or keep scrolling and I may ask one more thing.', ids: topIds(6), all: true }); } }
  save(); chatPaint();
}
function chatPaint() {
  var ms = $('ms'); if (!ms) return;
  ms.innerHTML = S.chat.map(function (m) {
    var cards = (m.ids || []).map(function (id) { var p = P(id); return p ? '<div class="mini" data-open="' + id + '"><b>' + esc(p.program) + '</b><span>' + esc(p.university) + ' | ' + esc(p.country) + '</span></div>' : ''; }).join('');
    return '<div class="m ' + (m.role === 'user' ? 'u' : 'b') + '">' + esc(m.content) + cards + (m.all ? '<div style="margin-top:10px"><button class="btn sm" data-seeall>See all matches</button></div>' : '') + '</div>';
  }).join('') + (busy ? '<div class="m b"><span class="typing"><i></i><i></i><i></i></span></div>' : '');
  ms.scrollTop = ms.scrollHeight;
  ms.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { openDetail(b.getAttribute('data-open')); }; });
  ms.querySelectorAll('[data-seeall]').forEach(function (b) { b.onclick = function () { var c = S.p.courseDecided === 'yes' ? catOfCourse(S.p.course) : ''; goExplore(c || '', S.p.countryDecided === 'yes' ? normCountry(S.p.country) : ''); }; });
  var opts = [], q = S.chatQ && qOf(S.chatQ);
  if (!busy) opts = q ? q.opts.concat(['Skip']) : STARTERS;
  $('cc').innerHTML = opts.map(function (o) { return '<button class="chip" data-o="' + esc(o) + '">' + esc(o) + '</button>'; }).join('');
  $('cc').querySelectorAll('[data-o]').forEach(function (b) { b.onclick = function () { var v = b.getAttribute('data-o'); if (S.chatQ) chipAnswer(v); else userSays(v); }; });
}
function chipAnswer(v) {
  var id = S.chatQ; S.chat.push({ role: 'user', content: v }); answerQ(id, v, true); chatNext();
}
function userSays(text) {
  if (busy) return;
  S.chat.push({ role: 'user', content: text });
  var st = staticAnswer(text);
  if (st) { S.chat.push({ role: 'assistant', content: st }); save(); return chatPaint(); }
  busy = true; save(); chatPaint();
  var msgs = S.chat.filter(function (m) { return !m.ids; }).slice(-6).map(function (m) { return { role: m.role, content: m.content }; });
  api('chat', { profile: S.p, notInterested: notNames(), colleges: topIds(8).map(function (id) { var p = P(id); return { name: p.program + ', ' + p.university + ', ' + p.country, note: p.reason || reasonOf(p, S.p) }; }), messages: msgs }).then(function (r) {
    S.chat.push({ role: 'assistant', content: r.text }); busy = false; save(); chatPaint();
  }).catch(function (e) { S.chat.push({ role: 'assistant', content: e.message + ' You can send your message again.' }); busy = false; save(); chatPaint(); });
}
/* nudges: one small tap question at a time while the student scrolls the lists */
function hideNudge() { nudgeQ = ''; var n = $('nudge'); if (n) n.classList.add('hide'); }
function showNudge(q) {
  var n = $('nudge'); if (!n) return;
  nudgeQ = q.id; lastNudge = Date.now();
  n.innerHTML = '<button class="nx" id="nclose" aria-label="Not now">x</button><b>Buddy</b><div class="nq">' + esc(q.q) + '</div><div class="chips">' + q.opts.map(function (o) { return '<button class="chip" data-nv="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') + '</div><div class="muted" style="font-size:12px">Your lists update right away.</div>';
  n.classList.remove('hide');
  n.querySelectorAll('[data-nv]').forEach(function (b) { b.onclick = function () { var id = nudgeQ; hideNudge(); answerQ(id, b.getAttribute('data-nv')); lastNudge = Date.now(); toast('Lists updated'); }; });
  $('nclose').onclick = function () { S.nudgeNo++; save(); hideNudge(); lastNudge = Date.now(); };
}
function showListNudge() {
  var n = $('nudge'); if (!n) return;
  nudgeQ = 'list'; lastNudge = Date.now();
  n.innerHTML = '<button class="nx" id="nclose" aria-label="Close">x</button><b>Buddy</b><div class="nq">Your list is ready, made from your answers.</div><div class="chips"><button class="chip" id="nlist">See my list</button></div>';
  n.classList.remove('hide');
  $('nlist').onclick = function () { hideNudge(); openChat(undefined, true); };
  $('nclose').onclick = function () { hideNudge(); };
}
function nudgeCheck() {
  if (S.step !== 'main' || tab !== 'home' || chatOpen || nudgeQ || $('ovs').children.length || S.nudgeNo >= 3 || !$('nudge')) return;
  var now = Date.now(); if (now - lastNudge < 35000) return;
  if (!(window.scrollY > 240) && now - pageT < 30000) return;
  var q = nextQ(S.chatQ); if (q) showNudge(q);
}
setInterval(nudgeCheck, 4000);
window.addEventListener('scroll', function () { if (!nudgeCheck.t) nudgeCheck.t = setTimeout(function () { nudgeCheck.t = 0; nudgeCheck(); }, 800); }, { passive: true });

/* ---------- splash that turns into the Buddy button ---------- */
function runSplash(sub) {
  var sp = $('splash'), orb = $('sporb'); if (!sp || !orb) return;
  if (location.search.indexOf('nosplash') >= 0) return;
  sp.querySelector('.sp-tag').textContent = sub || 'Your study abroad assistant';
  sp.className = 'on'; orb.className = 'on'; orb.removeAttribute('style');
  setTimeout(function () {
    var l = document.querySelector('#launch i'), r = orb.getBoundingClientRect();
    if (l && S.step === 'main') {
      var t = l.getBoundingClientRect();
      orb.style.animation = 'none'; orb.style.transition = 'transform .85s cubic-bezier(.6,0,.2,1)';
      orb.style.transform = 'translate(' + (t.left + t.width / 2 - (r.left + r.width / 2)) + 'px,' + (t.top + t.height / 2 - (r.top + r.height / 2)) + 'px) scale(' + (t.width / r.width) + ')';
    } else { orb.style.animation = 'none'; orb.style.transition = 'transform .6s, opacity .6s'; orb.style.transform = 'scale(.3)'; orb.style.opacity = '0'; }
    sp.classList.add('out');
    setTimeout(function () { sp.className = ''; orb.className = ''; orb.removeAttribute('style'); }, 1000);
  }, 1700);
}

/* ---------- start ---------- */
fetch('/api/health').then(function (r) { return r.json(); }).then(function (j) { LIVE = !!j.live; }).catch(function () { LIVE = true; }).then(function () { render(); runSplash(); });
</script>
